<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Калькулятор</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #0f1117;
    }
    .calculator {
      background: #1c1f26;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      width: 320px;
      padding: 20px;
    }
    .display {
      width: 100%;
      height: 70px;
      background: #12141a;
      border-radius: 10px;
      color: #fff;
      font-size: 32px;
      text-align: right;
      padding: 0 15px;
      border: none;
      outline: none;
      margin-bottom: 20px;
      overflow-x: auto;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    button {
      height: 55px;
      border-radius: 10px;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #fff;
      background: #2a2e39;
      transition: background 0.15s ease, transform 0.05s;
    }
    button:active {
      transform: scale(0.96);
    }
    button.op {
      background: #3b4252;
      color: #4efd54;
    }
    button.clear {
      background: #432b36;
      color: #ff5c77;
    }
    button.equal {
      background: #4efd54;
      color: #0f1117;
      font-weight: bold;
      grid-column: span 2;
    }
    button:hover {
      filter: brightness(1.15);
    }
  </style>
</head>
<body>

  <div class="calculator">
    <input type="text" class="display" id="display" value="0" readonly>
    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button class="clear" onclick="deleteLast()">⌫</button>
      <button class="op" onclick="appendValue('/')">/</button>
      <button class="op" onclick="appendValue('*')">×</button>

      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button class="op" onclick="appendValue('-')">-</button>

      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button class="op" onclick="appendValue('+')">+</button>

      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button onclick="appendValue('.')">.</button>

      <button onclick="appendValue('0')">0</button>
      <button class="equal" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');

    function appendValue(val) {
      if (display.value === '0' && val !== '.') {
        display.value = val;
      } else {
        const lastChar = display.value.slice(-1);
        const ops = ['+', '-', '*', '/'];
        if (ops.includes(val) && ops.includes(lastChar)) {
          display.value = display.value.slice(0, -1) + val;
          return;
        }
        display.value += val;
      }
    }

    function clearDisplay() {
      display.value = '0';
    }

    function deleteLast() {
      if (display.value.length === 1 || display.value === 'Error') {
        display.value = '0';
      } else {
        display.value = display.value.slice(0, -1);
      }
    }

    function calculate() {
      try {
        const expr = display.value.replace(/×/g, '*');
        const result = Function('"use strict"; return (' + expr + ')')();
        display.value = Number.isFinite(result) ? +result.toFixed(8) : 'Error';
      } catch (e) {
        display.value = 'Error';
      }
    }

    // Поддержка клавиатуры
    window.addEventListener('keydown', (e) => {
      if ((e.key >= '0' && e.key <= '9') || ['+', '-', '*', '/', '.'].includes(e.key)) {
        appendValue(e.key);
      } else if (e.key === 'Enter' || e.key === '=') {
        calculate();
      } else if (e.key === 'Backspace') {
        deleteLast();
      } else if (e.key === 'Escape') {
        clearDisplay();
      }
    });
  </script>
</body>
</html>
